name: Build legacy gallery test preview

on:
  push:
    branches:
      - merge-latest-gallery-test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-gallery-test-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build gallery
        run: npm run build

      - name: Prepare preview files
        run: |
          mkdir -p public
          cp build.html public/index.html
          cp -R images public/images

      - name: Upload preview files
        uses: actions/upload-artifact@v4
        with:
          name: legacy-gallery-test-preview
          path: public
          retention-days: 7
