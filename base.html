<!DOCTYPE html>
<html>
  <head>
    <title>Virtual Art Gallery: ARTIC paintings</title>
    <meta name="description" content="Explore a virtual art gallery on your browser. This procedurally generated architecture displays the paintings of the Art Institute of Chicago museum.">
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      #exhibition-entry {
        position: fixed; inset: 0; z-index: 100; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; padding: 20px; box-sizing: border-box;
        background: #211a15;
      }
      #exhibition-entry img {
        display: block; max-width: 100%; max-height: calc(100vh - 110px);
        width: auto; height: auto; object-fit: contain;
      }
      #enter-gallery {
        border: 1px solid #d8bd8b; border-radius: 8px; padding: 12px 30px;
        color: #fff8e9; background: #6b4b2b; font: 18px Tahoma, Arial, sans-serif;
        cursor: pointer;
      }
      #enter-gallery:focus-visible { outline: 3px solid #fff8e9; outline-offset: 3px; }
      .gallery-caption {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        box-sizing: border-box; text-align: center; direction: rtl;
        color: #4b3825; background: rgba(250, 246, 238, 0.88);
        border-top: 1px solid rgba(130, 101, 66, 0.28);
        font-family: Tahoma, Arial, sans-serif; font-size: clamp(13px, 2vw, 18px);
        line-height: 1.5; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="exhibition-entry" role="dialog" aria-label="ورود به نمایشگاه">
      <img src="images/1.jpg" alt="بنر اصلی نمایشگاه">
      <button id="enter-gallery" type="button">ورود به نمایشگاه</button>
    </div>
    <div class="gallery-caption">دومین جشنواره کشوری طراحی و دوخت لباس دانش‌آموزی</div>
    <script>
      document.getElementById('enter-gallery').addEventListener('click', function () {
        document.getElementById('exhibition-entry').remove();
      });
    </script>
    <script inline-htmlify></script>
  </body>
</html>
